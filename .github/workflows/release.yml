name: Release Pi Bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Defaults to v0.0.<run_number> if empty."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.tag }}" ]; then
              TAG="${{ inputs.tag }}"
            else
              TAG="v0.0.${{ github.run_number }}"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: pi/frontend/package-lock.json

      - name: Build React frontend
        working-directory: pi/frontend
        run: |
          npm ci
          npm run build

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify FastAPI backend
        working-directory: pi/backend
        run: |
          uv sync --frozen
          uv run python -c "from app.main import app; print('Backend import OK')"

      - name: Package Pi release bundle
        run: |
          rm -rf dist-bundle alarm-clock-pi.tar.gz SHA256SUMS
          mkdir -p dist-bundle/backend/static dist-bundle/scripts

          # Backend source and lockfiles (exclude .venv and local data/)
          cp -r pi/backend/app dist-bundle/backend/
          cp pi/backend/main.py dist-bundle/backend/
          cp pi/backend/pyproject.toml dist-bundle/backend/
          cp pi/backend/uv.lock dist-bundle/backend/
          cp pi/backend/.python-version dist-bundle/backend/
          cp pi/backend/README.md dist-bundle/backend/

          # Built React frontend served by FastAPI
          cp -r pi/frontend/dist/* dist-bundle/backend/static/

          # Updater and helper scripts
          cp -r pi/scripts/* dist-bundle/scripts/
          chmod +x dist-bundle/scripts/*.sh

          # Version marker
          echo "${RELEASE_TAG}" > dist-bundle/VERSION

          # Create tarball and checksum
          tar -czf alarm-clock-pi.tar.gz -C dist-bundle .
          sha256sum alarm-clock-pi.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Raspberry Pi Alarm Clock ${{ steps.tag.outputs.tag }}"
          generate_release_notes: true
          files: |
            alarm-clock-pi.tar.gz
            SHA256SUMS
